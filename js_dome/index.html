<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOOK STORE</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f4;
    }
    h1 {
      color: #333;
    }
    #root {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 20px;
    }
    .card {
      border: 2px solid blue;
      width: 200px;
      border-radius: 10px;
      margin: 10px;
      padding: 10px;
      background: #fff;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.1);
    }
    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 5px;
    }
    .card h2 {
      color: green;
      font-size: 18px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1><center> BOOK STORE</center></h1>
  <div id="root"></div>

  <!-- Linking external JS file -->
  <script src="index.js"></script>
</body>
</html>
